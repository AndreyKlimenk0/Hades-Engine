void main( uint3 threadID : SV_DispatchThreadID )
{
	int kernalSize = 1;
	float3 blurColor = float3(0.0f, 0.0f, 0.0f);
	float3 boxBlurDivisor = pow(2.0f * (float)kernalSize + 1.0f, 2.0f);

	for (int i = -kernalSize; i <= kernalSize; i++)
	{
		for (int j = -kernalSize; j <= kernalSize; j++)
		{
			blurColor += sceneBuffer[threadID.xy + float2(i, j)].xyz;
		}
	}
	blurColor /= boxBlurDivisor;
	backBuffer[threadID.xy] = float4(blurColor, 1.0f);
}

